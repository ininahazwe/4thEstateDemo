name: 🚀 Deploy 4estate-front to cPanel (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js
        run: npm run build
        env:
          # Inlinés dans le bundle au build : les changer côté cPanel
          # (Application Manager) n'a AUCUN effet, il faut redéployer.
          NEXT_PUBLIC_WP_API_URL: ${{ secrets.NEXT_PUBLIC_WP_API_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Create Passenger entry point (app.js)
        run: |
          cat > app.js <<'EOF'
          const { createServer } = require("http");
          const next = require("next");

          const app = next({ dev: false, dir: __dirname });
          const handle = app.getRequestHandler();

          app.prepare().then(() => {
            createServer((req, res) => handle(req, res)).listen(
              process.env.PORT || 3000,
              () => console.log("4estate-front ready")
            );
          });
          EOF

      - name: Package build artifacts
        run: |
          tar czf deploy.tar.gz \
            .next \
            public \
            app.js \
            package.json \
            package-lock.json \
            $(ls next.config.* 2>/dev/null || true)

      - name: Upload to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy.tar.gz
          target: /home/dxtrmfwa/deploy-tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 300s
          command_timeout: 300s
          script: |
            set -e
            echo "=== Deploiement 4estate-front (prod) ==="

            # Doit correspondre au Path de l'app dans Application Manager.
            # IMPORTANT : hors du docroot. Le docroot de thefourthestategh.com
            # est /home/dxtrmfwa/public_html/TFE ; y deployer le build exposait
            # .env / package.json / node_modules au web et entrait en conflit
            # avec le .htaccess WordPress residuel (403).
            APP_PATH="/home/dxtrmfwa/TFE"
            TMP="/home/dxtrmfwa/deploy-tmp"

            mkdir -p "$APP_PATH"
            cd "$APP_PATH"

            echo "Extraction des artefacts de build..."
            rm -rf .deploy-new
            mkdir .deploy-new
            tar xzf "$TMP/deploy.tar.gz" -C .deploy-new
            rm -f "$TMP/deploy.tar.gz"

            # Purge des swaps precedents (le process Passenger a lache
            # ses descripteurs depuis le dernier restart).
            rm -rf .next.old.* public.old.* 2>/dev/null || true

            # Swap du build : on RENOMME, on ne supprime pas.
            # `rm -rf .next` echoue avec "Directory not empty" tant que
            # l'app Node tourne : elle garde des fichiers ouverts dans
            # .next, le fs les recree pendant la suppression.
            STAMP="$(date +%s)"
            if [ -d .next ]; then mv .next ".next.old.$STAMP"; fi
            mv .deploy-new/.next .next
            if [ -d public ]; then mv public "public.old.$STAMP"; fi
            mv .deploy-new/public public 2>/dev/null || true
            mv -f .deploy-new/app.js .deploy-new/package.json .deploy-new/package-lock.json .
            mv -f .deploy-new/next.config.* . 2>/dev/null || true
            rm -rf .deploy-new || true

            echo "Installation des dependances de production..."
            npm ci --omit=dev --no-audit --no-fund

            echo "Redemarrage Passenger..."
            mkdir -p tmp
            touch tmp/restart.txt

            # Best-effort : ce qui resiste sera purge au prochain deploiement.
            sleep 5
            rm -rf .next.old.* public.old.* 2>/dev/null || true

            echo "=== Deploiement termine ==="

      - name: Resultat
        if: success()
        run: |
          echo "DEPLOIEMENT REUSSI - commit: ${{ github.sha }}"